[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]   # exploratory Colab notebook, not production code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "E501"]   # asserts fine in tests; long lines allowed in fixture data

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
